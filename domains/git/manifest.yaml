# Git workflow domain — skills and rules for commits, PRs, and releases.
# Requires nothing from the environment except a working git repo at skill-execution time.
# rules, skills, agents go to ~/.claude/ — global, not project-bound.

name: git
description: Git workflow — Conventional Commits, PR descriptions, semver releases.

requires_env: []

targets:
  rules:  ${CLAUDE_HOME}/rules
  skills: ${CLAUDE_HOME}/skills
  agents: ${CLAUDE_HOME}/agents
